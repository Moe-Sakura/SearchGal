[build]
  command = "bun install --frozen-lockfile"
  functions = "netlify/functions"

# 重定向到 Functions
[[redirects]]
  from = "/"
  to = "/.netlify/functions/index"
  status = 200

[[redirects]]
  from = "/gal"
  to = "/.netlify/functions/gal"
  status = 200

[[redirects]]
  from = "/patch"
  to = "/.netlify/functions/patch"
  status = 200

# 固定安装和构建工具版本
[build.environment]
  BUN_VERSION = "1.4.5"
  BUN_FLAGS = "--frozen-lockfile"

# 开发环境配置
[dev]
  port = 8888
